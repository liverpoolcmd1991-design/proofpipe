<!doctype html>
<!--
  DEV-ONLY tray UI preview. Lives OUTSIDE extension/ on purpose: it is not
  referenced by manifest.json, any content script, or chrome.runtime.getURL(),
  so shipping it inside the unpacked/Store package was dead weight that drifted
  from the real shadow-DOM styles in extension/content.js. Open this file
  directly in a browser to eyeball the tray chrome; when it changes, update
  content.js (the shipped source of truth) by hand.
-->
<html>
<head>
<meta charset="utf-8">
<title>ProofPipe tray preview</title>
<style>
  body { background: #0a0b0c; margin: 0; padding: 40px; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<h3 style="color:#9a9c9e">ProofPipe floating tray — UI preview</h3>
<div id="proofpipe-tray-host" style="position:fixed; z-index:2147483647;"></div>
<script>
const host = document.getElementById('proofpipe-tray-host');
const root = host.attachShadow({ mode: 'open' });

root.innerHTML = `
  <style>
    :host { all: initial; user-select: none; -webkit-user-select: none; }
    * {
      box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
    }
    .cell img { -webkit-user-drag: auto; }

    .fab {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(145deg, #1e2023, #17181a); color: #e8e8e6;
      border: 1px solid #2a2c2f; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.4), 0 0 0 0 rgba(72,76,80,0);
      display: grid; place-items: center; user-select: none;
      transition: border-color .18s, box-shadow .18s, transform .12s;
    }
    .fab:hover {
      border-color: #5a5d60;
      box-shadow: 0 6px 20px rgba(0,0,0,.45), 0 0 0 3px rgba(72,76,80,.12);
    }
    .fab:active { transform: scale(.93); }

    .panel {
      position: fixed; bottom: 64px; right: 14px; width: 280px;
      background: #17181a; color: #e8e8e6; border: 1px solid #2a2c2f;
      border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02);
      padding: 12px; display: block;
      opacity: 1; transform: translateY(0) scale(1); transform-origin: bottom right;
    }

    .head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
    .head b { font-size: 13px; letter-spacing: .2px; }
    .head-actions { display: flex; gap: 4px; align-items: center; }
    .icon-btn {
      background: none; border: 1px solid #2a2c2f; color: #9a9c9e;
      border-radius: 8px; font-size: 11px; padding: 4px 9px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; line-height: 1;
      transition: color .15s, border-color .15s, background .15s;
    }
    .icon-btn:hover { color: #e8e8e6; border-color: #4a4d50; background: rgba(255,255,255,.03); }
    .icon-btn.hide-btn:hover { color: #f59e0b; border-color: #5a4a20; background: rgba(245,158,11,.06); }
    .icon-btn svg { width: 12px; height: 12px; flex: none; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 238px; overflow-y: auto; }
    .grid::-webkit-scrollbar { width: 5px; }
    .grid::-webkit-scrollbar-track { background: transparent; }
    .grid::-webkit-scrollbar-thumb { background: #2a2c2f; border-radius: 3px; }

    .cell {
      position: relative; border-radius: 8px; overflow: hidden; cursor: grab;
      border: 1px solid #2a2c2f; background: #1d1f21;
      transition: border-color .15s, box-shadow .15s;
    }
    .cell:hover { border-color: #4a4d50; box-shadow: 0 0 0 2px rgba(72,76,80,.15); }
    .cell img { width: 100%; height: 72px; object-fit: cover; display: block; transition: transform .2s; }
    .cell:hover img { transform: scale(1.04); }
    .cell .id {
      pointer-events: none;
      position: absolute; bottom: 3px; left: 3px; font-size: 9px; color: #fff;
      background: rgba(0,0,0,.65); border-radius: 4px; padding: 0 4px; line-height: 13px;
    }

    .status { font-size: 11px; color: #9a9c9e; padding: 8px 4px 2px; text-align: center; min-height: 16px; }
    .empty { font-size: 12px; color: #9a9c9e; text-align: center; padding: 18px 6px; grid-column: 1 / -1; line-height: 1.5; border: 1px dashed #2a2c2f; border-radius: 10px; }
    .fab:focus-visible, .icon-btn:focus-visible, .txtsend:focus-visible, .cell:focus-visible, .txtitem:focus-visible, .txt:focus-visible { outline: 2px solid #22c55e; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    .textsec { border-top: 1px solid #2a2c2f; margin-top: 8px; padding-top: 8px; }
    .txthead { font-size: 11px; color: #9a9c9e; padding: 0 4px 6px; display: flex; justify-content: space-between; align-items: center; }
    .txtrow { display: flex; gap: 6px; }
    .txt {
      flex: 1; min-width: 0; resize: none; height: 34px;
      background: #1d1f21; border: 1px solid #2a2c2f; color: #e8e8e6;
      border-radius: 8px; padding: 6px 8px; font-size: 12px; outline: none;
      user-select: text; -webkit-user-select: text;
      transition: border-color .15s;
    }
    .txt:focus { border-color: #4a4d50; }
    .txt::placeholder { color: #6f7274; }
    .txtsend {
      flex: none; width: 46px; border: 1px solid #2a2c2f; border-radius: 8px;
      background: #1d1f21; color: #22c55e; font-size: 12px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .txtsend:hover { border-color: #4a4d50; background: rgba(34,197,94,.06); }
    .txtitem {
      font-size: 11px; color: #e8e8e6; background: #1d1f21; border: 1px solid #2a2c2f;
      border-radius: 6px; padding: 5px 8px; margin-top: 5px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: border-color .15s, background .15s;
    }
    .txtitem:hover { border-color: #4a4d50; background: rgba(255,255,255,.03); }
    .txtnone { font-size: 11px; color: #6f7274; padding: 4px; text-align: center; }
  </style>
  <button class="fab" title="ProofPipe captures"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"/><circle cx="4" cy="12" r="2.75"/><circle cx="20" cy="12" r="2.75"/></svg></button>
  <div class="panel">
    <div class="head">
      <b>ProofPipe</b>
      <div class="head-actions">
        <button class="icon-btn sync" title="Re-check the ProofPipe server now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          Sync
        </button>
        <button class="icon-btn reload" title="Reload captures">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>
    <div class="grid">
      <div class="cell"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 60'%3E%3Crect width='80' height='60' fill='%23333'/%3E%3C/svg%3E"><span class="id">#1</span></div>
      <div class="cell"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 60'%3E%3Crect width='80' height='60' fill='%23444'/%3E%3C/svg%3E"><span class="id">#2</span></div>
      <div class="cell"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 60'%3E%3Crect width='80' height='60' fill='%23555'/%3E%3C/svg%3E"><span class="id">#3</span></div>
    </div>
    <div class="textsec">
      <div class="txthead"><b>Text</b><span>type &rarr; phone &middot; tap text = copy</span></div>
      <div class="txtrow">
        <textarea class="txt" placeholder="type text to send to your phone..."></textarea>
        <button class="txtsend" title="Send to phone">&#10148;</button>
      </div>
    </div>
    <div class="status">drag &rarr; chat &middot; click = copy</div>
  </div>
`;
</script>
</body>
</html>
